<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PideYa Local - GitHub Pages</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg-app: #f7f8fa; --primary: #ff5722; --dark: #121212; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-app); color: var(--dark); margin: 0; padding-bottom: 110px; }
[hidden] { display: none !important; }
.hero-carousel-wrapper { position: absolute; top: 0; left: 0; right: 0; height: 340px; z-index: 1; background: #000; overflow: hidden; }
.hero-banner-card { width: 100%; height: 100%; }
.hero-banner-card img { width: 100%; height: 100%; object-fit: cover; }
.carousel-dots { position: absolute; bottom: 65px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; z-index: 5; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5); }
.dot.active { width: 20px; background: #fff; }
.top-header-app { position: absolute; top: 0; left: 0; right: 0; z-index: 20; padding: 12px 16px; display: flex; }
.location-pill-app { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 0.85rem; color: #fff !important; cursor: pointer; background: rgba(0,0,0,0.35); backdrop-filter: blur(8px); padding: 6px 14px; border-radius: 20px; }
.search-action-bar { position: absolute; top: 64px; left: 0; right: 0; z-index: 20; padding: 0 16px; display: flex; gap: 10px; }
.search-input-box { flex-grow: 1; background: rgba(255,255,255,0.9); border-radius: 22px; padding: 8px 14px; display: flex; gap: 8px; }
.search-input-box input { border: none; background: transparent; width: 100%; outline: none; }
.btn-orange-search { background: var(--primary); color: #fff; border: none; border-radius: 20px; padding: 9px 18px; font-weight: 700; }
.icon-action-btn { width: 42px; height: 42px; border-radius: 14px; background: #fff; border: none; display: flex; align-items: center; justify-content: center; }
.categories-horizontal { margin-top: 285px; position: relative; z-index: 10; background: #fff; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 16px; display: flex; gap: 16px; overflow-x: auto; }
.cat-bubble { text-align: center; cursor: pointer; min-width: 65px; }
.cat-icon-circle { width: 55px; height: 55px; border-radius: 50%; background: #f8f9fa; border: 1px solid #eee; display: flex; align-items: center; justify-content: center; margin: 0 auto 6px auto; }
.cat-bubble.active .cat-icon-circle { background: var(--dark); color: #fff; }
.feed-grid-2col { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px 16px; }
.store-grid-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); cursor: pointer; }
.store-grid-thumb { position: relative; width: 100%; height: 110px; background: #f1f2f6; }
.store-grid-thumb img { width: 100%; height: 100%; object-fit: cover; }
.store-grid-info { padding: 10px; }
.store-grid-name { font-size: 13.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bottom-nav-app { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: #fff; box-shadow: 0 -4px 20px rgba(0,0,0,0.08); display: flex; justify-content: space-around; align-items: center; z-index: 1030; }
.bottom-nav-item { background: none; border: none; display: flex; flex-direction: column; align-items: center; color: #6c757d; font-size: 11px; font-weight: 600; width: 33.3%; }
.bottom-nav-item.active { color: var(--primary); }
.floating-cart-bar { position: fixed; bottom: 76px; left: 16px; right: 16px; background: var(--dark); color: #fff; border-radius: 25px; padding: 14px 20px; display: flex; justify-content: space-between; z-index: 1025; }
</style>
</head>
<body>
<div id="clientApp">
  <div id="viewHome">
    <div class="hero-carousel-wrapper"><div id="heroBannerBox" class="hero-banner-card"></div><div id="heroDotsBox" class="carousel-dots"></div></div>
    <div class="top-header-app"><div class="location-pill-app" onclick="cambiarUbicacionMaps()"><i class="bi bi-geo-alt-fill text-danger"></i><span id="txtUbicacionMaps">Ingresar ubicación</span></div></div>
    <div class="search-action-bar"><div class="search-input-box"><i class="bi bi-search"></i><input id="buscadorApp" placeholder="Buscar en PideYa..." onkeyup="filtrarRestaurantesHome()"></div><button class="btn-orange-search" onclick="filtrarRestaurantesHome()">Buscar</button><button class="icon-action-btn" onclick="abrirModalCarrito()"><i class="bi bi-cart3"></i></button></div>
    <div id="categoriasFiltroGrid" class="categories-horizontal"></div>
    <div class="px-2 pt-3 bg-white"><div class="d-flex justify-content-between px-2 mb-2"><h6 class="fw-bold m-0">Locales Disponibles</h6><button class="btn btn-outline-secondary btn-sm rounded-pill" onclick="cargarDatosApp()">↻</button></div><div id="listadoRestaurantesVertical" class="feed-grid-2col"></div></div>
  </div>
  <div id="viewTiendaDetalle" hidden>
    <div style="height:190px;background:#000;position:relative;"><img id="detCover" style="width:100%;height:100%;object-fit:cover;opacity:.75"><button class="btn btn-light rounded-circle position-absolute top-0 start-0 m-3" style="width:38px;height:38px;" onclick="cerrarTiendaDetalle()"><i class="bi bi-chevron-left"></i></button></div>
    <div class="bg-white px-4 pt-3 pb-3" style="margin-top:-20px;border-radius:20px 20px 0 0;position:relative;"><h4 id="detNombre" class="fw-bold m-0"></h4><small id="detCategoriaInfo" class="text-muted"></small><div class="d-flex gap-3 mt-2 small"><span>⭐ <b id="detRating"></b></span><span>⚡ <b id="detTiempo"></b></span><span id="detEnvioBadge" class="text-success fw-bold"></span></div></div>
    <div class="px-3 mt-2"><h6 class="fw-bold">Menú</h6><div id="detMenuProductos" class="vstack gap-2"></div></div>
  </div>
  <div id="cartBarApp" class="floating-cart-bar" onclick="abrirModalCarrito()" style="display:none;"><div class="d-flex gap-3 align-items-center"><div id="lblCartQty" class="bg-white text-dark rounded-circle d-flex align-items-center justify-content-center" style="width:34px;height:34px;font-weight:800;">0</div><div><span style="font-size:0.65rem;" class="text-white-50">TOTAL</span><br><span id="lblCartSumTotal" class="fw-bold">$0</span></div></div><span class="text-warning fw-bold small">Ver pedido <i class="bi bi-chevron-right"></i></span></div>
</div>
<nav class="bottom-nav-app"><button class="bottom-nav-item active" onclick="irAlInicioApp()"><i class="bi bi-house-door-fill"></i><span>Inicio</span></button><button class="bottom-nav-item" onclick="abrirHistorialComprasApp()"><i class="bi bi-clipboard-check"></i><span>Actividad</span></button><button class="bottom-nav-item" onclick="abrirModalMiCuentaApp()"><i class="bi bi-person-circle"></i><span>Mi cuenta</span></button></nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyNfaXBsDRmW-fiifJS0Vvlt3vQz3eeQ3e6hXO9LFrrd4DD8_QAc9tR2Tc4daNy0cMA/exec';

function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function actionArg(v){return JSON.stringify(String(v??''));}
function toDirectImg(u){if(!u)return'';let s=String(u).trim();if(s.includes('thumbnail?id='))return s;let m=s.match(/\/d\/([a-zA-Z0-9_-]+)/);if(m)return'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1000';let m2=s.match(/[?&]id=([a-zA-Z0-9_-]+)/);if(m2)return'https://drive.google.com/thumbnail?id='+m2[1]+'&sz=w1000';return s;}
function imageUrl(v){let c=toDirectImg(v);if(!c)return'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=200';return c;}
function storageGet(k,f=''){try{return localStorage.getItem(k)??f;}catch{return f;}}
function storageSet(k,v){try{localStorage.setItem(k,v);}catch{}}
function readCartApp(){try{return JSON.parse(storageGet('pideya_cart_app','[]'))||[];}catch{return[];}}
function ratingLabel(r){return r.calificacion?.promedio?.toFixed(1)||'4.8';}
function timeLabel(v){return (v||30)+' Min';}
function pesosApp(v){return '$'+Number(v).toLocaleString('es-CO');}

async function api(name,...args){
  const url=new URL(GAS_URL);
  url.searchParams.set('action',name);
  url.searchParams.set('args',JSON.stringify(args));
  const res=await fetch(url);
  const j=await res.json();
  if(!j.ok) throw new Error(j.error||'Error API');
  return j.data;
}

let DB={restaurantes:[],productos:[],banners:[]};
let carritoApp=readCartApp(),categoriaFiltroSeleccionada='TODAS',bannerIndexActual=0,bannerTimer=null,tiendaSeleccionadaId='';

window.onload=async()=>{
  document.getElementById('txtUbicacionMaps').innerText=storageGet('pideya_maps_ubi')||'Ingresar ubicación';
  await cargarDatosApp();
};

async function cargarDatosApp(){
  try{
    const data=await api('getAppData');
    DB=data;
    iniciarCarruselBanners();renderCategoriasFiltros();renderRestaurantesVertical();updateCartUIApp();
  }catch(e){alert('Error cargando: '+e.message+'\n\nAsegúrate que en Apps Script tu doGet devuelva JSON y que la implementación esté en "Cualquiera"');}
}
function iniciarCarruselBanners(){
  let bans=DB.banners&&DB.banners.length?DB.banners.slice(0,3):[{img:'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800'}];
  let box=document.getElementById('heroBannerBox'),dots=document.getElementById('heroDotsBox');
  function show(i){box.innerHTML=`<div style="width:100%;height:100%;cursor:pointer;" onclick="abrirTienda(${actionArg(bans[i].idRest||'')})"><img src="${imageUrl(bans[i].img)}" style="width:100%;height:100%;object-fit:cover;"></div>`;dots.innerHTML=bans.map((_,k)=>`<div class="dot ${k===i?'active':''}"></div>`).join('');}
  show(0);if(bans.length>1){bannerTimer=setInterval(()=>{bannerIndexActual=(bannerIndexActual+1)%bans.length;show(bannerIndexActual);},4000);}
}
function renderCategoriasFiltros(){
  let cats=['TODAS'];DB.restaurantes.forEach(r=>{if(r.categoria&&!cats.includes(r.categoria))cats.push(r.categoria);});
  document.getElementById('categoriasFiltroGrid').innerHTML=cats.map(c=>`<div class="cat-bubble ${c===categoriaFiltroSeleccionada?'active':''}" onclick="seleccionarFiltroCat(${actionArg(c)})"><div class="cat-icon-circle">${c==='TODAS'?'🍽️':'🍔'}</div><span>${escapeHtml(c)}</span></div>`).join('');
}
function seleccionarFiltroCat(c){categoriaFiltroSeleccionada=c;renderCategoriasFiltros();renderRestaurantesVertical();}
function renderRestaurantesVertical(){
  let q=document.getElementById('buscadorApp').value.toLowerCase().trim();
  let lista=DB.restaurantes.filter(r=>{let cat=categoriaFiltroSeleccionada==='TODAS'||r.categoria===categoriaFiltroSeleccionada;let qq=!q||r.nombre.toLowerCase().includes(q);return cat&&qq;});
  let box=document.getElementById('listadoRestaurantesVertical');
  if(!lista.length){box.innerHTML='<div class="text-center py-4 text-muted small" style="grid-column:span 2;">No hay locales</div>';return;}
  box.innerHTML=lista.map(r=>`<div class="store-grid-card" onclick="abrirTienda(${actionArg(r.id)})"><div class="store-grid-thumb"><img src="${imageUrl(r.portada||r.logo)}"></div><div class="store-grid-info"><div class="store-grid-name">${escapeHtml(r.nombre)}</div><div class="small text-muted">★ ${ratingLabel(r)} · ${timeLabel(r.tiempo)}</div></div></div>`).join('');
}
function filtrarRestaurantesHome(){renderRestaurantesVertical();}
function abrirTienda(id){let r=DB.restaurantes.find(x=>x.id===id);if(!r)return;tiendaSeleccionadaId=id;document.getElementById('detCover').src=imageUrl(r.portada||r.logo);document.getElementById('detNombre').innerText=r.nombre;document.getElementById('detCategoriaInfo').innerText=r.categoria;document.getElementById('detRating').innerText=ratingLabel(r);document.getElementById('detTiempo').innerText=timeLabel(r.tiempo);document.getElementById('detEnvioBadge').innerText=r.envioGratis?'Envío Gratis':'Envío $'+(r.costoEnvio||0);let prods=DB.productos.filter(p=>p.idRest===id);document.getElementById('detMenuProductos').innerHTML=prods.map(p=>`<div class="bg-white p-3 rounded-4 shadow-sm d-flex gap-3 align-items-center"><img src="${imageUrl(p.foto)}" style="width:70px;height:70px;object-fit:cover;border-radius:12px;"><div class="flex-grow-1"><b class="small">${escapeHtml(p.nombre)}</b><br><small class="text-muted">${escapeHtml(p.desc||'')}</small><br><span class="fw-bold text-danger small">$${p.precio.toLocaleString()}</span></div><button class="btn btn-dark rounded-circle" style="width:34px;height:34px;" onclick="modificarCantidadApp(${actionArg(p.id)},1)"><i class="bi bi-plus"></i></button></div>`).join('');document.getElementById('viewHome').hidden=true;document.getElementById('viewTiendaDetalle').hidden=false;window.scrollTo(0,0);}
function cerrarTiendaDetalle(){document.getElementById('viewTiendaDetalle').hidden=true;document.getElementById('viewHome').hidden=false;}
function modificarCantidadApp(id,d){let it=carritoApp.find(x=>x.id===id);if(it){it.qty+=d;}else if(d>0)carritoApp.push({id:id,qty:1});carritoApp=carritoApp.filter(x=>x.qty>0);storageSet('pideya_cart_app',JSON.stringify(carritoApp));updateCartUIApp();}
function updateCartUIApp(){let q=carritoApp.reduce((s,i)=>s+i.qty,0);document.getElementById('lblCartQty').innerText=q;document.getElementById('cartBarApp').style.display=q>0?'flex':'none';let tot=0;carritoApp.forEach(it=>{let p=DB.productos.find(x=>x.id===it.id);if(p)tot+=p.precio*it.qty;});document.getElementById('lblCartSumTotal').innerText='$'+tot.toLocaleString();}
function abrirModalCarrito(){alert('Tienes '+carritoApp.length+' tipos de productos');}
function irAlInicioApp(){cerrarTiendaDetalle();}
function abrirHistorialComprasApp(){let h=JSON.parse(storageGet('pideya_compras_recientes','[]'));alert(h.length?JSON.stringify(h,null,2):'Sin compras');}
function abrirModalMiCuentaApp(){alert('Panel de comercios sigue en tu Script original');}
function cambiarUbicacionMaps(){let d=prompt('Tu dirección:');if(d){storageSet('pideya_maps_ubi',d);document.getElementById('txtUbicacionMaps').innerText=d;}}
</script>
</body>
</html>
