<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PideYa Local - GitHub Pages</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* TU MISMO CSS - SIN CAMBIOS */
:root { --bg-app: #f7f8fa; --primary: #ff5722; --primary-dark: #e64a19; --dark: #121212; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-app); color: var(--dark); margin: 0; padding-bottom: 110px; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
#viewHome { position: relative; width: 100%; min-height: 100vh; overflow-x: hidden; }
.hero-carousel-wrapper { position: absolute; top: 0; left: 0; right: 0; height: 340px; z-index: 1; background: #000; overflow: hidden; }
.hero-carousel-wrapper::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 130px; background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent); z-index: 2; pointer-events: none; }
.hero-banner-card { width: 100%; height: 100%; position: relative; cursor: pointer; }
.hero-banner-card img { width: 100%; height: 100%; object-fit: cover; }
.carousel-dots { position: absolute; bottom: 65px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; z-index: 5; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5); transition: all 0.3s ease; }
.dot.active { width: 20px; border-radius: 4px; background: #ffffff; }
.top-header-app { position: absolute; top: 0; left: 0; right: 0; z-index: 20; background: transparent !important; padding: 12px 16px; display: flex; align-items: center; justify-content: flex-start; }
.location-pill-app { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 0.85rem; color: #fff !important; cursor: pointer; background: rgba(0, 0, 0, 0.35); backdrop-filter: blur(8px); padding: 6px 14px; border-radius: 20px; }
.location-pill-app i { color: #ff5722 !important; }
.search-action-bar { position: absolute; top: 64px; left: 0; right: 0; z-index: 20; padding: 0 16px; background: transparent !important; display: flex; align-items: center; gap: 10px; }
.search-input-box { flex-grow: 1; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-radius: 22px; padding: 8px 14px; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); }
.search-input-box input { border: none; background: transparent; width: 100%; outline: none; font-size: 0.9rem; color: #111; }
.btn-orange-search { background: var(--primary); color: #fff; border: none; border-radius: 20px; padding: 9px 18px; font-weight: 700; font-size: 0.85rem; }
.icon-action-btn { width: 42px; height: 42px; border-radius: 14px; background: rgba(255, 255, 255, 0.9); border: none; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #333; flex-shrink: 0; }
.categories-horizontal { margin-top: 285px; position: relative; z-index: 10; background: #ffffff; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 16px; display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.08); }
.categories-horizontal::-webkit-scrollbar { display: none; }
.cat-bubble { text-align: center; cursor: pointer; min-width: 65px; }
.cat-icon-circle { width: 55px; height: 55px; border-radius: 50%; background: #f8f9fa; border: 1px solid #eee; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; margin: 0 auto 6px auto; }
.cat-bubble.active .cat-icon-circle { background: var(--dark); color: #fff; border-color: var(--dark); }
.cat-bubble span { font-size: 0.72rem; font-weight: 600; color: #555; display: block; white-space: nowrap; }
.feed-grid-2col { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px 16px; }
.store-grid-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; cursor: pointer; }
.store-grid-thumb { position: relative; width: 100%; height: 110px; background: #f1f2f6; }
.store-grid-thumb img { width: 100%; height: 100%; object-fit: cover; }
.badge-nueva-app { position: absolute; top: 6px; left: 6px; background: #e6f7ed; color: #0a7a33; font-size: 8.5px; font-weight: 800; padding: 3px 6px; border-radius: 6px; z-index: 2; }
.store-grid-info { padding: 10px; display: flex; flex-direction: column; gap: 3px; }
.store-grid-name { font-size: 13.5px; font-weight: 800; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.store-grid-meta { font-size: 11px; color: #6b7280; display: flex; gap: 4px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.store-grid-meta b { color: #111; }
.banner-grid-card { border-radius: 16px; overflow: hidden; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; min-height: 165px; color: white; background-size: cover; background-position: center; }
.banner-grid-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.7)); z-index: 1; }
.banner-grid-content { position: relative; z-index: 2; }
.banner-grid-title { font-size: 13.5px; font-weight: 800; margin-bottom: 4px; }
.banner-grid-btn { display: inline-block; background: #fff; color: #111; font-size: 10.5px; font-weight: 700; padding: 4px 10px; border-radius: 20px; margin-top: 6px; }
.bottom-nav-app { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: #ffffff; box-shadow: 0 -4px 20px rgba(0,0,0,0.08); display: flex; justify-content: space-around; align-items: center; z-index: 1030; }
.bottom-nav-item { background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #6c757d; font-size: 11px; font-weight: 600; cursor: pointer; width: 33.3%; gap: 2px; }
.bottom-nav-item.active { color: var(--primary); }
.bottom-nav-item i { font-size: 1.25rem; }
.floating-cart-bar { position: fixed; bottom: 76px; left: 16px; right: 16px; background: var(--dark); color: #fff; border-radius: 25px; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; z-index: 1025; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
</style>
</head>
<body>
<div id="clientApp">
  <div id="viewHome">
    <div class="hero-carousel-wrapper" id="heroCarouselWrapper"><div id="heroBannerBox" class="hero-banner-card"></div><div id="heroDotsBox" class="carousel-dots"></div></div>
    <div class="top-header-app"><div class="location-pill-app" onclick="cambiarUbicacionMaps()"><i class="bi bi-geo-alt-fill text-danger fs-5"></i><div><span id="txtUbicacionMaps" class="d-block text-white fw-bold">Ingresar ubicación</span></div><i class="bi bi-chevron-right small text-white-50"></i></div></div>
    <div class="search-action-bar"><div class="search-input-box"><i class="bi bi-search text-muted"></i><input id="buscadorApp" placeholder="Buscar en PideYa..." onkeyup="filtrarRestaurantesHome()"></div><button class="btn-orange-search" onclick="filtrarRestaurantesHome()">Buscar</button><button class="icon-action-btn" onclick="abrirModalCarrito()"><i class="bi bi-cart3"></i></button></div>
    <div id="categoriasFiltroGrid" class="categories-horizontal"></div>
    <div class="px-2 pt-3 bg-white" style="position:relative; z-index:10;"><div class="d-flex justify-content-between align-items-center px-2 mb-2"><h6 class="fw-bold m-0">Locales Disponibles</h6><button type="button" class="btn btn-outline-secondary btn-sm rounded-pill py-0 px-2" style="font-size:0.75rem;" onclick="cargarDatosApp()">↻ Actualizar</button></div><p id="coverageStatusApp" class="small text-muted px-2 mb-2"></p><div id="listadoRestaurantesVertical" class="feed-grid-2col"></div></div>
  </div>
  <div id="viewTiendaDetalle" hidden><div class="position-relative" style="height: 190px; background: #000;"><img id="detCover" src="" class="w-100 h-100 object-fit-cover opacity-75"><button class="btn btn-light rounded-circle position-absolute top-0 start-0 m-3 shadow-sm" style="width:38px;height:38px;" onclick="cerrarTiendaDetalle()"><i class="bi bi-chevron-left fs-5"></i></button></div><div class="bg-white px-4 pt-3 pb-3 shadow-sm rounded-top-4 position-relative" style="margin-top: -20px;"><h4 id="detNombre" class="fw-bold m-0">Restaurante</h4><small id="detCategoriaInfo" class="text-muted">Categoría</small><div class="d-flex align-items-center gap-3 mt-2 small text-secondary"><span>⭐ <b id="detRating" class="text-dark">4.8</b></span><span>⚡ <b id="detTiempo" class="text-dark">35 Min</b></span><span id="detEnvioBadge" class="text-success fw-bold">Envío $1,000</span></div></div><div class="px-3 mt-2"><h6 class="fw-bold mb-3">Menú</h6><div id="detMenuProductos" class="vstack gap-2"></div></div></div>
  <div id="cartBarApp" class="floating-cart-bar" onclick="abrirModalCarrito()" style="display:none;"><div class="d-flex align-items-center gap-3"><div class="bg-white text-dark rounded-circle fw-bold d-flex align-items-center justify-content-center" style="width:34px;height:34px;" id="lblCartQty">0</div><div><span class="d-block text-white-50" style="font-size:0.65rem; font-weight:700;">TOTAL</span><span class="fw-bold fs-6" id="lblCartSumTotal">$0</span></div></div><div class="fw-bold text-warning small d-flex align-items-center gap-1"><span>Ver pedido</span> <i class="bi bi-chevron-right"></i></div></div>
</div>
<nav id="bottomNav" class="bottom-nav-app"><button class="bottom-nav-item active" onclick="irAlInicioApp()"><i class="bi bi-house-door-fill"></i><span>Inicio</span></button><button class="bottom-nav-item" onclick="abrirHistorialComprasApp()"><i class="bi bi-clipboard-check"></i><span>Actividad</span></button><button class="bottom-nav-item" onclick="abrirModalMiCuentaApp()"><i class="bi bi-person-circle"></i><span>Mi cuenta</span></button></nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ====== CONFIG - PEGA TU URL AQUÍ ======
const GAS_URL = 'PEGA_AQUI_TU_URL_EXEC_DE_GOOGLE_SCRIPT';
// Ejemplo: https://script.google.com/macros/s/AKfycbw.../exec

function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function actionArg(v){return JSON.stringify(String(v??''));}
function toDirectImg(u){if(!u)return'';let s=String(u).trim();if(s.includes('thumbnail?id='))return s;let m=s.match(/\/d\/([a-zA-Z0-9_-]+)/);if(m)return'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1000';let m2=s.match(/[?&]id=([a-zA-Z0-9_-]+)/);if(m2)return'https://drive.google.com/thumbnail?id='+m2[1]+'&sz=w1000';return s;}
function imageUrl(v,fallback='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=200'){let cleaned=toDirectImg(v);if(!cleaned)return fallback;return /^https:\/\/[^\s<>"']+$/i.test(cleaned)?cleaned:fallback;}
function storageGet(k,f=''){try{return localStorage.getItem(k)??f;}catch(e){return f;}}
function storageSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function readCartApp(){try{const items=JSON.parse(storageGet('pideya_cart_app','[]'));if(!Array.isArray(items))return[];const ids=new Set();return items.filter(i=>i&&typeof i.id==='string'&&Number.isInteger(i.qty)&&i.qty>0&&i.qty<=50&&!ids.has(i.id)&&ids.add(i.id)).map(i=>({id:i.id.trim().toUpperCase(),qty:i.qty}));}catch(e){return[];}}
function ratingLabel(r){return r.calificacion?.revision?'En revisión':r.calificacion?.promedio==null?'Sin votos':Number(r.calificacion.promedio).toFixed(1);}
function timeLabel(v){return String(v||30).replace(/\s*min(?:utos)?\s*$/i,'')+' Min';}
function pesosApp(v){return '$'+Number(v).toLocaleString('es-CO');}

// ===== NUEVA FUNCION API PARA GITHUB PAGES =====
async function api(name,...args){
  if(GAS_URL.includes('PEGA_AQUI')) throw new Error('Pega tu URL de Google Script en la variable GAS_URL arriba');
  const url = new URL(GAS_URL);
  url.searchParams.set('action', name);
  url.searchParams.set('args', JSON.stringify(args));
  const res = await fetch(url.toString());
  const json = await res.json();
  if(!json.ok) throw new Error(json.error||'Error API');
  return json.data;
}

let DB={restaurantes:[],productos:[],banners:[]};
let tiendaSeleccionadaId='',carritoApp=readCartApp(),categoriaFiltroSeleccionada='TODAS',bannerIndexActual=0,bannerTimer=null,zonaClienteApp=null;

window.onload=async()=>{
  document.getElementById('txtUbicacionMaps').innerText=storageGet('pideya_maps_ubi')||'Ingresar ubicación';
  await cargarDatosApp();
};

async function cargarDatosApp(){
  try{
    const data=await api('getAppData');
    DB=data;
    iniciarCarruselBanners();renderCategoriasFiltros();renderRestaurantesVertical();updateCartUIApp();
  }catch(e){alert('Error: '+e.message+' - Verifica que tu Apps Script tenga doGet con action=getAppData y esté Implementado como "Cualquiera"');}
}

function iniciarCarruselBanners(){
  if(bannerTimer){clearInterval(bannerTimer);}
  let bans=DB.banners&&DB.banners.length?DB.banners.slice(0,3):[{img:'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800'}];
  let box=document.getElementById('heroBannerBox'),dotsBox=document.getElementById('heroDotsBox');
  function mostrarBanner(idx){
    let b=bans[idx];box.innerHTML=`<div style="width:100%;height:100%;" onclick="abrirTienda(${actionArg(b.idRest||'')})"><img src="${imageUrl(b.img)}"></div>`;
    dotsBox.innerHTML=bans.map((_,i)=>`<div class="dot ${i===idx?'active':''}"></div>`).join('');
  }
  mostrarBanner(0);
  if(bans.length>1){bannerTimer=setInterval(()=>{bannerIndexActual=(bannerIndexActual+1)%bans.length;mostrarBanner(bannerIndexActual);},4500);}
}
function renderCategoriasFiltros(){
  let cats=['TODAS'];DB.restaurantes.forEach(r=>{if(r.categoria&&!cats.includes(r.categoria))cats.push(r.categoria);});
  let iconosMap={'TODAS':'🍽️','Pizzas':'🍕','Hamburguesas':'🍔'};
  let box=document.getElementById('categoriasFiltroGrid');
  box.innerHTML=cats.map(c=>`<div class="cat-bubble ${c===categoriaFiltroSeleccionada?'active':''}" onclick="seleccionarFiltroCat(${actionArg(c)})"><div class="cat-icon-circle">${iconosMap[c]||'🍔'}</div><span>${escapeHtml(c)}</span></div>`).join('');
}
function seleccionarFiltroCat(cat){categoriaFiltroSeleccionada=cat;renderCategoriasFiltros();renderRestaurantesVertical();}
function renderRestaurantesVertical(){
  let q=document.getElementById('buscadorApp').value.toLowerCase().trim();
  let lista=DB.restaurantes.filter(r=>{let matchCat=categoriaFiltroSeleccionada==='TODAS'||r.categoria===categoriaFiltroSeleccionada;let matchQ=!q||r.nombre.toLowerCase().includes(q);return matchCat&&matchQ;});
  let box=document.getElementById('listadoRestaurantesVertical');
  if(!lista.length){box.innerHTML='<div class="text-center py-4 text-muted small" style="grid-column: span 2;">No se encontraron locales.</div>';return;}
  box.innerHTML=lista.map(r=>`<div class="store-grid-card" onclick="abrirTienda(${actionArg(r.id)})"><div class="store-grid-thumb"><img src="${imageUrl(r.portada||r.logo)}" loading="lazy"><\/div><div class="store-grid-info"><div class="store-grid-name">${escapeHtml(r.nombre)}<\/div><div class="store-grid-meta"><span><b>★ ${ratingLabel(r)}<\/b><\/span><\/div><\/div><\/div>`).join('');
}
function filtrarRestaurantesHome(){renderRestaurantesVertical();}
function abrirTienda(id){let r=DB.restaurantes.find(x=>x.id===id);if(!r)return;tiendaSeleccionadaId=id;document.getElementById('detCover').src=imageUrl(r.portada||r.logo);document.getElementById('detNombre').innerText=r.nombre;document.getElementById('detCategoriaInfo').innerText=r.categoria;document.getElementById('detRating').innerText=ratingLabel(r);document.getElementById('detTiempo').innerText=timeLabel(r.tiempo);let prods=DB.productos.filter(p=>p.idRest===id);document.getElementById('detMenuProductos').innerHTML=prods.map(p=>`<div class="bg-white p-3 rounded-4 shadow-sm mb-2 d-flex gap-3 align-items-center"><img src="${imageUrl(p.foto)}" style="width:70px;height:70px;object-fit:cover;border-radius:12px;"><div class="flex-grow-1"><b class="d-block text-dark small">${escapeHtml(p.nombre)}<\/b><small class="text-muted d-block" style="font-size:0.75rem;">${escapeHtml(p.desc)}<\/small><span class="fw-bold text-danger small">$${p.precio.toLocaleString()}<\/span><\/div><button class="btn btn-dark rounded-circle" style="width:34px;height:34px;" onclick="modificarCantidadApp(${actionArg(p.id)},1)"><i class="bi bi-plus"><\/i><\/button><\/div>`).join('');document.getElementById('viewHome').hidden=true;document.getElementById('viewTiendaDetalle').hidden=false;window.scrollTo(0,0);}
function cerrarTiendaDetalle(){document.getElementById('viewTiendaDetalle').hidden=true;document.getElementById('viewHome').hidden=false;}
function modificarCantidadApp(id,delta){const item=carritoApp.find(x=>x.id===id);if(item){item.qty+=delta;}else if(delta>0)carritoApp.push({id:id,qty:1});carritoApp=carritoApp.filter(x=>x.qty>0);storageSet('pideya_cart_app',JSON.stringify(carritoApp));updateCartUIApp();}
function updateCartUIApp(){let totalQty=carritoApp.reduce((s,i)=>s+i.qty,0);document.getElementById('lblCartQty').innerText=totalQty;document.getElementById('cartBarApp').style.display=totalQty>0?'flex':'none';let total=0;carritoApp.forEach(it=>{let p=DB.productos.find(x=>x.id===it.id);if(p)total+=p.precio*it.qty;});document.getElementById('lblCartSumTotal').innerText='$'+total.toLocaleString();}
function abrirModalCarrito(){alert('Carrito: '+carritoApp.length+' productos');}
function irAlInicioApp(){cerrarTiendaDetalle();}
function abrirHistorialComprasApp(){alert('Historial próximamente');}
function abrirModalMiCuentaApp(){alert('Login de comercios próximamente - sigue en tu Script');}
function cambiarUbicacionMaps(){let dir=prompt('Ingresa tu dirección:');if(dir){storageSet('pideya_maps_ubi',dir);document.getElementById('txtUbicacionMaps').innerText=dir;}}
</script>
</body>
</html>
