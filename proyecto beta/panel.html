<section id="panelApp" hidden style="background: var(--bg-app); min-height: 100vh; padding-bottom: 90px;">
  
  <header style="background: #121212; position: sticky; top: 0; z-index: 1020; padding: 14px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03);">
    <div class="d-flex justify-content-between align-items-center text-white">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-shop text-warning fs-5"></i>
        <span id="panelHeaderId" class="fw-bold" style="font-size: 0.95rem;">Panel de Comercio</span>
      </div>
      <button class="btn btn-outline-light btn-sm rounded-pill px-3 py-1 fw-bold" style="font-size: 0.8rem;" onclick="cerrarSesionPanel()">Salir ✕</button>
    </div>
  </header>

  <main class="container py-3" style="max-width: 600px;">
    
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white mb-3">
      <div class="position-relative" style="height: 130px; background: #e9ecef;">
        <img id="panelCoverPreview" src="" class="w-100 h-100 object-fit-cover" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600'">
        <label class="position-absolute bottom-0 end-0 m-2 btn btn-dark btn-sm rounded-pill shadow-sm px-2 py-1" style="font-size: 0.7rem; cursor: pointer;">
          <i class="bi bi-camera"></i> Portada
          <input type="file" accept="image/*" class="d-none" onchange="subirImagenDispositivo(event, 'portada')">
        </label>
      </div>
      
      <div class="px-4 pb-4 position-relative" style="margin-top: -35px;">
        <div class="d-flex align-items-end gap-3 mb-3">
          <div class="position-relative" style="width: 75px; height: 75px; flex-shrink: 0;">
            <img id="panelLogoPreview" src="" class="w-100 h-100 rounded-circle object-fit-cover border border-3 border-white shadow-sm bg-white" onerror="this.src='https://via.placeholder.com/75?text=Logo'">
            <label class="position-absolute bottom-0 end-0 bg-dark text-white rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 26px; height: 26px; font-size: 0.75rem; cursor: pointer;">
              <i class="bi bi-camera-fill"></i>
              <input type="file" accept="image/*" class="d-none" onchange="subirImagenDispositivo(event, 'logo')">
            </label>
          </div>
          <div class="flex-grow-1 mb-1">
            <h5 id="panelNombreNegocio" class="fw-bold m-0 text-dark">Nombre del Local</h5>
            <span id="panelCategoriaNegocio" class="text-muted small">Categoría</span>
          </div>
        </div>

        <div id="panelMetrics" class="bg-light p-3 rounded-4 small text-secondary d-flex justify-content-around text-center border"></div>
      </div>
    </div>

    <details class="card border-0 shadow-sm rounded-4 p-3 bg-white mb-3">
      <summary class="fw-bold text-dark" style="cursor: pointer;">⚙️ Configurar Datos, Horarios y Cobertura</summary>
      <form id="coverageForm" class="mt-3" onsubmit="guardarConfiguracionPanel(event)">
        <div class="mb-2">
          <label class="form-label small fw-bold">Nombre del Restaurante</label>
          <input id="cfgNombre" class="form-control rounded-pill" required>
        </div>
        <div class="mb-2">
          <label class="form-label small fw-bold">Categoría</label>
          <input id="cfgCategoria" class="form-control rounded-pill" required>
        </div>
        <div class="mb-2">
          <label class="form-label small fw-bold">WhatsApp de Pedidos</label>
          <input id="cfgWhatsApp" type="tel" class="form-control rounded-pill" placeholder="573001234567" required>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-6"><label class="form-label small fw-bold">Apertura</label><input id="cfgApertura" type="time" class="form-control rounded-pill" required></div>
          <div class="col-6"><label class="form-label small fw-bold">Cierre</label><input id="cfgCierre" type="time" class="form-control rounded-pill" required></div>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-6"><label class="form-label small fw-bold">Costo Domicilio ($)</label><input id="cfgCostoEnvio" type="number" class="form-control rounded-pill" required></div>
          <div class="col-6"><label class="form-label small fw-bold">Tiempo (Min)</label><input id="cfgTiempo" class="form-control rounded-pill" placeholder="30-45" required></div>
        </div>
        <div class="mb-2">
          <label class="form-label small fw-bold">Municipio / Ciudad</label>
          <input id="coverageCity" class="form-control rounded-pill" maxlength="100" placeholder="Ej.: Medellín, Antioquia">
        </div>
        <div class="row g-2 mb-2">
          <div class="col-6"><label class="form-label small fw-bold">Latitud</label><input id="coverageLat" class="form-control rounded-pill" type="number" step="any" required></div>
          <div class="col-6"><label class="form-label small fw-bold">Longitud</label><input id="coverageLng" class="form-control rounded-pill" type="number" step="any" required></div>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Radio de entrega (km)</label>
          <input id="coverageRadius" class="form-control rounded-pill" type="number" min="0.1" max="200" step="any" required>
        </div>
        <button id="coverageGpsButton" type="button" class="btn btn-outline-dark btn-sm rounded-pill w-100 mb-2" onclick="gpsLocalPanel()">📍 Usar ubicación GPS actual</button>
        <p id="coverageMessage" class="small text-muted text-center" role="status" aria-live="polite"></p>
        <button type="submit" class="btn btn-dark w-100 rounded-pill py-2 fw-bold">Guardar Configuración</button>
      </form>
    </details>

    <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="fw-bold m-0">Menús y Platos</h6>
        <button class="btn btn-dark btn-sm rounded-pill px-3 fw-bold" onclick="editProductPanel()">+ Nuevo Plato</button>
      </div>
      <div id="panelProducts" class="vstack gap-2"></div>
    </div>
  </main>
</section>

<dialog id="productDialog" style="border: 0; border-radius: 20px; max-width: 440px; width: 92%; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);">
  <form id="productForm" onsubmit="guardarProductoPanel(event)">
    <h5 id="productTitle" class="fw-bold mb-3">Gestionar Plato</h5>
    <input id="prodId" type="hidden">

    <div class="mb-2">
      <label class="form-label small fw-bold">Nombre del Plato</label>
      <input id="prodNombre" maxlength="120" class="form-control rounded-pill" required>
    </div>
    <div class="mb-2">
      <label class="form-label small fw-bold">Descripción</label>
      <textarea id="prodDesc" maxlength="1000" class="form-control rounded-3" rows="2"></textarea>
    </div>
    <div class="row g-2 mb-2">
      <div class="col-6">
        <label class="form-label small fw-bold">Precio Oferta ($)</label>
        <input id="prodPrecio" type="number" min="1" step="1" class="form-control rounded-pill" required>
      </div>
      <div class="col-6">
        <label class="form-label small fw-bold">Precio Normal ($)</label>
        <input id="prodProdAnt" type="number" min="0" step="1" class="form-control rounded-pill" placeholder="Opcional">
      </div>
    </div>
    <div class="mb-2">
      <label class="form-label small fw-bold">Categoría</label>
      <input id="prodCategoria" maxlength="80" class="form-control rounded-pill" required>
    </div>
    
    <div class="mb-3">
      <label class="form-label small fw-bold">Foto del Plato</label>
      <div class="input-group mb-1">
        <input id="prodFoto" maxlength="2000" class="form-control rounded-start-pill" placeholder="https://... o sube una imagen">
        <label class="btn btn-outline-secondary rounded-end-pill px-3 d-flex align-items-center" style="cursor:pointer;" title="Subir desde dispositivo">
          <i class="bi bi-upload"></i>
          <input type="file" accept="image/*" class="d-none" onchange="subirImagenPlatoDispositivo(event)">
        </label>
      </div>
    </div>

    <p id="productError" class="text-danger small fw-bold" role="alert"></p>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-dark w-100 rounded-pill py-2 fw-bold">Guardar</button>
      <button type="button" class="btn btn-light w-100 rounded-pill py-2 fw-bold border" onclick="document.getElementById('productDialog').close()">Cancelar</button>
    </div>
  </form>
</dialog>

<script>
let panelData = null;
const busyProductsPanel = new Set();
let savingProductPanel = false, leavingPanel = false;

window.loadPanel = async function() {
  panelData = await api('getDatosTienda', window.panelToken);
  const r = panelData.rest;

  document.getElementById('panelHeaderId').textContent = `ID: ${r.id}`;
  document.getElementById('panelNombreNegocio').textContent = r.nombre;
  document.getElementById('panelCategoriaNegocio').textContent = r.categoria || 'Comida y Bebidas';
  
  document.getElementById('panelLogoPreview').src = r.logo || '';
  document.getElementById('panelCoverPreview').src = r.portada || '';

  document.getElementById('panelMetrics').innerHTML = `
    <div>
      <span class="d-block text-dark fw-bold fs-6">${r.abierto ? '🟢 Abierto' : '🔴 Cerrado'}</span>
      <span class="text-muted" style="font-size: 0.7rem;">ESTADO</span>
    </div>
    <div>
      <span class="d-block text-dark fw-bold fs-6">⭐ ${ratingLabel(r)}</span>
      <span class="text-muted" style="font-size: 0.7rem;">(${Number(r.calificacion.votos)||0} votos)</span>
    </div>
    <div>
      <span class="d-block text-dark fw-bold fs-6">${r.clicks || 0}</span>
      <span class="text-muted" style="font-size: 0.7rem;">CLICS WPP</span>
    </div>
  `;

  document.getElementById('cfgNombre').value = r.nombre || '';
  document.getElementById('cfgCategoria').value = r.categoria || '';
  document.getElementById('cfgWhatsApp').value = r.whatsapp || '';
  document.getElementById('cfgApertura').value = r.apertura || '08:00';
  document.getElementById('cfgCierre').value = r.cierre || '22:00';
  document.getElementById('cfgCostoEnvio').value = r.costoEnvio || 0;
  document.getElementById('cfgTiempo').value = r.tiempo || '30-45';
  document.getElementById('coverageCity').value = r.municipio || '';
  document.getElementById('coverageLat').value = r.cobertura?.lat ?? '';
  document.getElementById('coverageLng').value = r.cobertura?.lng ?? '';
  document.getElementById('coverageRadius').value = r.cobertura?.radioKm ?? '';

  renderPanelProducts();
};

function subirImagenDispositivo(event, tipo) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(e) {
    const base64Url = e.target.result;
    if (tipo === 'logo') {
      document.getElementById('panelLogoPreview').src = base64Url;
      panelData.rest.logo = base64Url;
    } else {
      document.getElementById('panelCoverPreview').src = base64Url;
      panelData.rest.portada = base64Url;
    }
    await guardarCambiosAutomaticosTienda();
  };
  reader.readAsDataURL(file);
}

function subirImagenPlatoDispositivo(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById('prodFoto').value = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function guardarCambiosAutomaticosTienda() {
  try {
    const r = panelData.rest;
    await api('guardarConfiguracionTienda', window.panelToken, {
      nombre: r.nombre,
      categoria: r.categoria,
      whatsapp: r.whatsapp,
      logo: r.logo,
      portada: r.portada,
      apertura: r.apertura,
      cierre: r.cierre,
      costoEnvio: r.costoEnvio,
      envioGratis: r.envioGratis,
      estado: r.estado || 'Abierto',
      tiempo: r.tiempo
    });
  } catch(e) {
    console.warn('Error al actualizar imagen:', e.message);
  }
}

async function guardarConfiguracionPanel(e) {
  e.preventDefault();
  try {
    await api('guardarConfiguracionTienda', window.panelToken, {
      nombre: document.getElementById('cfgNombre').value,
      categoria: document.getElementById('cfgCategoria').value,
      whatsapp: document.getElementById('cfgWhatsApp').value,
      logo: panelData.rest.logo || '',
      portada: panelData.rest.portada || '',
      apertura: document.getElementById('cfgApertura').value,
      cierre: document.getElementById('cfgCierre').value,
      costoEnvio: document.getElementById('cfgCostoEnvio').value,
      envioGratis: false,
      estado: 'Abierto',
      tiempo: document.getElementById('cfgTiempo').value
    });
    
    await api('guardarCoberturaTienda', window.panelToken, {
      lat: document.getElementById('coverageLat').value,
      lng: document.getElementById('coverageLng').value,
      radioKm: document.getElementById('coverageRadius').value,
      municipio: document.getElementById('coverageCity').value
    });

    alert('¡Configuración guardada con éxito!');
    await window.loadPanel();
  } catch(err) {
    alert('Error al guardar: ' + err.message);
  }
}

function renderPanelProducts() {
  const box = document.getElementById('panelProducts');
  box.replaceChildren();

  panelData.productos.forEach(p => {
    const card = document.createElement('div');
    card.className = 'p-2 border rounded-4 d-flex justify-content-between align-items-center bg-light';

    card.innerHTML = `
      <div class="d-flex gap-2 align-items-center">
        <img src="${imageUrl(p.foto)}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 10px; background:#fff;" onerror="this.src='https://via.placeholder.com/50?text=Plato'">
        <div>
          <b class="d-block text-dark small text-truncate" style="max-width:140px;">${escapeHtml(p.nombre)}</b>
          <span class="text-danger fw-bold small">\$${Number(p.precio || 0).toLocaleString()}</span>
        </div>
      </div>
      <div class="d-flex align-items-center gap-1">
        <button class="btn btn-sm btn-outline-dark rounded-pill px-2 py-1" style="font-size: 0.7rem;" onclick="toggleDispPanel(${actionArg(p.id)}, ${!p.disponible})">
          ${p.disponible ? 'Desactivar' : 'Activar'}
        </button>
        <button class="btn btn-sm btn-light border rounded-circle" onclick="editProductPanelById(${actionArg(p.id)})">
          <i class="bi bi-pencil small"></i>
        </button>
        <button class="btn btn-sm btn-light border rounded-circle text-danger" onclick="eliminarProdPanel(${actionArg(p.id)})">
          <i class="bi bi-trash small"></i>
        </button>
      </div>
    `;
    box.appendChild(card);
  });
}

async function toggleDispPanel(id, disp) {
  if(busyProductsPanel.has(id)) return;
  busyProductsPanel.add(id);
  try {
    await api('setDisponibilidadProducto', window.panelToken, id, disp);
    await window.loadPanel();
  } catch(e) { alert(e.message); } finally { busyProductsPanel.delete(id); }
}

function editProductPanelById(id) {
  const p = panelData?.productos.find(x => x.id === id);
  if(p) editProductPanel(p);
}

function editProductPanel(p = {}) {
  document.getElementById('productTitle').textContent = p.id ? 'Editar Plato' : 'Nuevo Plato';
  document.getElementById('productError').textContent = '';

  document.getElementById('prodId').value = p.id || '';
  document.getElementById('prodNombre').value = p.nombre || '';
  document.getElementById('prodDesc').value = p.desc || '';
  document.getElementById('prodPrecio').value = p.precio || '';
  document.getElementById('prodProdAnt').value = p.precioAnterior || '';
  document.getElementById('prodCategoria').value = p.categoria || '';
  document.getElementById('prodFoto').value = p.foto || '';

  document.getElementById('productDialog').showModal();
}

async function guardarProductoPanel(e) {
  e.preventDefault();
  if(savingProductPanel) return;
  savingProductPanel = true;
  try {
    await api('guardarProductoTienda', window.panelToken, {
      id: document.getElementById('prodId').value,
      nombre: document.getElementById('prodNombre').value,
      desc: document.getElementById('prodDesc').value,
      precio: document.getElementById('prodPrecio').value,
      precioAnterior: document.getElementById('prodProdAnt').value,
      categoria: document.getElementById('prodCategoria').value,
      foto: document.getElementById('prodFoto').value
    });
    document.getElementById('productDialog').close();
    await window.loadPanel();
  } catch(err) {
    document.getElementById('productError').textContent = err.message;
  } finally { savingProductPanel = false; }
}

async function eliminarProdPanel(id) {
  if(busyProductsPanel.has(id)) return;
  const p = panelData?.productos.find(x => x.id === id);
  if(!p || !confirm('¿Eliminar ' + p.nombre + '?')) return;
  busyProductsPanel.add(id);
  try {
    await api('eliminarProducto', window.panelToken, id);
    await window.loadPanel();
  } catch(e) { alert(e.message); } finally { busyProductsPanel.delete(id); }
}

function gpsLocalPanel() {
  if(!navigator.geolocation) { alert('GPS no disponible.'); return; }
  navigator.geolocation.getCurrentPosition(p => {
    document.getElementById('coverageLat').value = p.coords.latitude;
    document.getElementById('coverageLng').value = p.coords.longitude;
    document.getElementById('coverageMessage').textContent = '¡Ubicación GPS obtenida con éxito!';
  }, () => { alert('No se pudo obtener el GPS.'); }, { enableHighAccuracy: true });
}

async function cerrarSesionPanel() {
  if(leavingPanel) return;
  leavingPanel = true;
  try {
    await api('cerrarSesion', window.panelToken);
    window.panelToken = '';
    panelData = null;
    storageSet('pideya_panel_token', '');
    document.getElementById('panelApp').hidden = true;
    document.getElementById('clientApp').hidden = false;
    await cargarDatosApp();
  } catch(e) { alert('Error al salir: ' + e.message); }
  finally { leavingPanel = false; }
}
</script>
